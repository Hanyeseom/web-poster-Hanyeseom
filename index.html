<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="poster">
        <div class="paper-shape"></div>
        <div class="circle-shape"></div>
        <div class="mobile-red-shape"></div>
        
        <div class="biographies">
            <div class="biography">
                <h2>Designer Name <span>Role</span></h2>
                <p class="biography__copy biography__copy--desktop">Detailed biography goes here.</p>
                <p class="biography__copy biography__copy--mobile">Shorter biography goes here.</p>
            </div>
            <!-- Repeat for more biographies -->
        </div>

        <div class="title-block">
            <div class="title-block__international">International Exhibition</div>
            <div class="title-block__headline">Main Headline</div>
            <div class="title-block__style">Style Description</div>
        </div>

        <div class="exhibition">
            <div class="exhibition__subtitle">Exhibition Subtitle</div>
            <div class="exhibition__details">
                <div class="exhibition__date">Date: YYYY-MM-DD</div>
                <div class="exhibition__description">Description of the exhibition goes here.</div>
            </div>
        </div>

        <div class="designer-list">
            <div>Designer 1</div>
            <div>Designer 2</div>
            <!-- Repeat for more designers -->
        </div>

        <div class="poster-footer">
            <div class="museum-mark">
                <div class="museum-mark__symbol">🏛️</div>
                <div class="museum-mark__caption">Museum Name</div>
            </div>
        </div>
    </div>
</body>
</html>
